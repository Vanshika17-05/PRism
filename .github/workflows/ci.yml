name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript lint, test, and build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      USE_MOCKS: "true"
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint server and client
        run: pnpm lint:js

      - name: Run server tests
        run: pnpm test

      - name: Build client
        run: pnpm build

      - name: Build badge service
        run: pnpm --filter @prism/badge-service build

  python:
    name: Python lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-service/requirements.txt ruff pytest

      - name: Lint Python service
        run: ruff check python-service/app

      - name: Run Python tests when present
        shell: bash
        run: |
          if find python-service -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest python-service
          else
            echo "No Python tests found; lint completed successfully."
          fi
