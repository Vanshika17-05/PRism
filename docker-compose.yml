services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - prism_mongo:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - prism_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-service:
    build:
      context: .
      dockerfile: python-service/Dockerfile
    restart: unless-stopped
    env_file: python-service/.env
    environment:
      CHROMA_PERSIST_DIR: /data/chroma
    ports:
      - "8100:8100"
    volumes:
      - prism_chroma:/data/chroma

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"

  badge-service:
    build:
      context: .
      dockerfile: badge-service/Dockerfile
    restart: unless-stopped
    environment:
      PRISM_API_URL: http://server:4100
    ports:
      - "3000:3000"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/prism
      PYTHON_SERVICE_URL: http://python-service:8100
      REDIS_URL: redis://redis:6379
      LOCAL_STORAGE_DIR: /data/storage
      ANALYTICS_DB_PATH: /data/analytics.sqlite
    ports:
      - "4100:4100"
    volumes:
      - prism_server_data:/data
    depends_on:
      mongo:
        condition: service_healthy
      python-service:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile.worker
    restart: unless-stopped
    env_file: server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/prism
      PYTHON_SERVICE_URL: http://python-service:8100
      REDIS_URL: redis://redis:6379
      LOCAL_STORAGE_DIR: /data/storage
      ANALYTICS_DB_PATH: /data/analytics.sqlite
    volumes:
      - prism_server_data:/data
    depends_on:
      mongo:
        condition: service_healthy
      python-service:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  prism_mongo:
  prism_chroma:
  prism_redis:
  prism_server_data:
