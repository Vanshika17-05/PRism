services:
  - type: web
    name: prism-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars: &server-env
      - key: NODE_ENV
        value: production
      - key: USE_MOCKS
        value: "false"
      - key: PORT
        value: "4100"
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: USE_S3
        value: "false"
      - key: REVIEW_CONCURRENCY
        value: "2"

  - type: worker
    name: prism-worker
    runtime: docker
    dockerfilePath: ./server/Dockerfile.worker
    dockerContext: .
    envVars: *server-env

  - type: web
    name: prism-python
    runtime: docker
    dockerfilePath: ./python-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: USE_MOCKS
        value: "false"
      - key: PORT
        value: "8100"
      - key: CHROMA_PERSIST_DIR
        value: /data/chroma
